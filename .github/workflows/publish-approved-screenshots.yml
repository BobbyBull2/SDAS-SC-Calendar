name: Publish Reaction-Approved Discord Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: write

concurrency:
  group: approved-sdas-gallery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/screenshot-requirements.txt
      - name: Collect exactly reacted screenshots, newest 25 only
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/sync_discord_screenshots.py --reaction-is-approval --output gallery-staging
      - name: Validate and replace published gallery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('gallery-staging/manifest.json').read_text())
          assert d['publicationApproved'] is True
          assert d['mode'] == 'reaction-approved-production'
          assert d['galleryLimit'] == 25
          assert len(d['images']) <= 25
          assert len(d['images']) >= 1, 'Refuse to replace live gallery with zero images'
          assert all(i['approval'] == 'reaction-approved' for i in d['images'])
          assert all((Path('gallery-staging') / i['file']).is_file() for i in d['images'])
          PY
          rm -rf screenshot-gallery
          mv gallery-staging screenshot-gallery
      - name: Commit snapshot only if changed
        run: |
          if git diff --quiet -- screenshot-gallery && [ -z "$(git ls-files --others --exclude-standard screenshot-gallery)" ]; then
            echo 'Screenshot gallery unchanged.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- screenshot-gallery/
          git commit -m "Refresh reaction-approved SDAS screenshot gallery (max 25)"
          git pull --rebase origin main
          git push origin HEAD:main
