name: Test Discord Screenshot Reactions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect screenshot reactions (not officer approvals)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/test_discord_screenshots.py
