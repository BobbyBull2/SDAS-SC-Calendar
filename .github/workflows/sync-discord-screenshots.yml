name: Prepare Discord Screenshot Review Bundle

on:
  workflow_dispatch:
    inputs:
      include_provisional:
        description: 'Include provisional candidates for local review only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-screenshot-review
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster image decoder
        run: python -m pip install -r scripts/screenshot-requirements.txt
      - name: Download reaction-matched screenshots for review only
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          INCLUDE_PROVISIONAL: ${{ inputs.include_provisional }}
          SDAS_APPROVER_IDS: ${{ vars.SDAS_APPROVER_IDS }}
        run: |
          args=()
          if [ "$INCLUDE_PROVISIONAL" = "true" ]; then args+=(--include-provisional); fi
          python scripts/sync_discord_screenshots.py --output screenshot-review "${args[@]}"
      - name: Save review bundle (no publication or deployment)
        uses: actions/upload-artifact@v4
        with:
          name: sdas-screenshot-review-${{ github.run_id }}
          path: screenshot-review/
          if-no-files-found: error
          retention-days: 90
