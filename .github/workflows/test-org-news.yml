name: Validate SDAS Org News Publisher

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/publish_org_news.py
      - tests/test_org_news.py
      - .github/workflows/test-org-news.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated news publication tests
        run: python -m unittest discover -s tests -p test_org_news.py -v
