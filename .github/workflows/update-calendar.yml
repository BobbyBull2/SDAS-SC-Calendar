name: Build Star Citizen Calendar

on:
  pull_request:
    branches: [main]
    paths:
      - events.json
      - generate_calendar.py
      - fetch_discord_events.py
      - .github/workflows/update-calendar.yml
  push:
    branches: [main]
    paths:
      - events.json
      - generate_calendar.py
      - fetch_discord_events.py
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-citizen-calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch SDAS Discord scheduled events
        if: github.event_name != 'pull_request'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: "1518410019249459236"
        run: python fetch_discord_events.py

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Validate generated ICS
        run: |
          grep -q '^BEGIN:VCALENDAR' star-citizen-events.ics
          grep -q '^END:VCALENDAR' star-citizen-events.ics
          test "$(grep -c '^BEGIN:VEVENT' star-citizen-events.ics)" -gt 0

      - name: Verify PR generator
        if: github.event_name == 'pull_request'
        run: |
          python generate_calendar.py
          echo "Generator completed successfully for pull request."

      - name: Commit calendar if changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- star-citizen-events.ics; then
            echo "Calendar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-citizen-events.ics
          git commit -m "chore: sync CIG/RSI and SDAS Discord calendar"
          git push
